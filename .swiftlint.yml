# Gate config for `swiftlint lint --strict Sources Tests App`.
# Lint only first-party sources; never the build tree or generated artifacts.
included:
  - Sources
  - Tests
  - App

excluded:
  - .build
  - DerivedData
  - Sukiru.xcodeproj

custom_rules:
  toolbar_item_via_column_action:
    name: "Toolbar items go through ColumnAction"
    regex: '\bToolbarItem(Group)?\s*[({]'
    excluded: '.*/ColumnAction\.swift'
    message: >-
      Declare toolbar controls with ColumnAction (App/Views/ColumnAction.swift), not
      ToolbarItem or ToolbarItemGroup: a bare item or group renders with a different glass
      from the rest of the app.
    severity: error
