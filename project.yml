name: Sukiru

options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true

# The generated Sukiru.xcodeproj is gitignored and regenerated by
# `xcodegen generate` (Scripts/build-app.sh). Nothing here is committed
# except this spec.
packages:
  SukiruCore:
    path: .

targets:
  Sukiru:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/SukiruIcon.icon
        type: file
    dependencies:
      # The SwiftUI layer consumes SukiruCore value types only; no logic lives
      # in the app. Linking the local SwiftPM package here is the only link
      # between the two.
      - package: SukiruCore
        product: SukiruCore
    settings:
      base:
        PRODUCT_NAME: Sukiru
        PRODUCT_BUNDLE_IDENTIFIER: app.sukiru
        # Ad-hoc signing: no team, no provisioning profile.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sukiru
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 David Weng. Released under the Apache-2.0 License"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: SukiruIcon
        # Extract localizable strings on every build so
        # Scripts/sync-strings.sh can sync the String Catalogs.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          # Size-optimized release builds (AGENTS.md): -Osize plus the
          # default dead-code stripping keeps the bundle tiny.
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: []
