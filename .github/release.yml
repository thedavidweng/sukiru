changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
      - automated
      - bot
      - github-actions
    authors:
      - dependabot[bot]
      - github-actions[bot]
      - github-actions
      - action-bot

  categories:
    - title: 🚨 Breaking Changes
      labels:
        - breaking-change
    - title: ✨ New Features
      labels:
        - feat
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: ⚡ Performance
      labels:
        - perf
        - performance
    - title: ♻️ Refactoring
      labels:
        - refactor
    - title: 📝 Documentation
      labels:
        - docs
        - documentation
    - title: 🔧 Maintenance & Chores
      labels:
        - chore
        - ci
        - build
    - title: Other Changes
      labels: ["*"]
