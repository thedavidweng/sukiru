name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Install tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen

      - parallel:
          - name: Run SwiftLint (Strict Mode)
            run: swiftlint lint --strict

          - name: Run test suite (Zero Warnings)
            run: swift test -Xswiftc -warnings-as-errors

      - name: Determine tag and version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package release artifacts
        env:
          MARKETING_VERSION: ${{ steps.vars.outputs.version }}
        run: ./Scripts/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/Sukiru.dmg
            dist/Sukiru.zip
            dist/checksums.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
