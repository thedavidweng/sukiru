name: Temporary token permission check
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: token-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.pull_request.head.ref == 'fix/dependabot-codeql-updates' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token permissions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/test/dependabot-token-permissions -f sha="$sha" --silent
          file="$(gh api "repos/$REPO/contents/.github/workflows/codeql.yml?ref=main")"
          gh api --method PUT "repos/$REPO/contents/.github/workflows/codeql.yml" \
            -f message='test: verify workflow permissions' \
            -f branch=test/dependabot-token-permissions \
            -f sha="$(jq -r .sha <<< "$file")" \
            -f content="$(jq -r .content <<< "$file" | tr -d '\n')" --silent
          echo "Token can update workflow files."
