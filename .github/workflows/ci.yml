name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: swift gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install gate tools
        run: brew install swiftlint xcodegen

      - name: Resolve dependencies
        run: swift package resolve

      - name: Test (swift test)
        run: swift test

      # Build the SwiftUI app only once its XcodeGen spec exists.
      # Until the app target lands, project.yml is absent and this step is a no-op.
      - name: Build app (xcodegen generate && xcodebuild)
        run: |
          if [ -f project.yml ]; then
            xcodegen generate
            xcodebuild -scheme Sukiru -configuration Debug \
              -destination 'platform=macOS,arch=arm64' build
          else
            echo "project.yml not present yet — skipping app build gate."
          fi

      - name: Lint (swiftlint)
        run: swiftlint lint --strict Sources Tests

      - name: Format lint (swift format)
        run: swift format lint --recursive --strict Sources Tests
