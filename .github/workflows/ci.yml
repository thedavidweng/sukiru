name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint, Test and Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen

      # Lint and format only read sources. The bundle build stays after
      # the test so it reuses .build instead of compiling twice.
      - parallel:
          - name: Run SwiftLint (Strict Mode)
            run: swiftlint lint --strict

          - name: Check Swift formatting
            run: swift format lint --strict --recursive Sources Tests App

          - name: Run test suite (Zero Warnings)
            run: swift test -Xswiftc -warnings-as-errors

      - name: Test release signing gate
        run: python3 Scripts/test-notarization.py

      - name: Build application bundle
        run: Scripts/build-app.sh
