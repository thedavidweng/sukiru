name: Dependabot auto-merge

on:
  pull_request:

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable auto-merge
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for safe updates
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch'
          || (
            steps.meta.outputs.update-type == 'version-update:semver-minor'
            && steps.meta.outputs.dependency-type != 'direct:production'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          deny='googleapis/release-please-action dependabot/fetch-metadata'
          names="${{ steps.meta.outputs.dependency-names }}"
          for blocked in $deny; do
            case " $names " in
              *" $blocked "*) echo "skip auto-merge: $blocked"; exit 0 ;;
            esac
          done
          gh pr merge --auto --squash "$PR_URL"
