[package]
name = "gino"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native manager for Vercel-compatible agent skills"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thedavidweng/gino"
homepage = "https://github.com/thedavidweng/gino"

[lib]
name = "gino_core"
path = "src/lib.rs"

[[bin]]
name = "gino"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
zip = { version = "7", default-features = false, features = ["deflate"] }

# Vendored gpui-component 0.5.1 with one fix: markdown headings render as a
# block div instead of an h_flex row so long headings wrap instead of
# overflowing (gpui measures flex-row text min-content unwrapped, so heading
# text in an h_flex could never wrap). See vendor/gpui-component/src/text/node.rs.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
result_large_err = "allow"

[profile.release]
lto = true
codegen-units = 1
