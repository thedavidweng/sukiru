[package]
name = "gino"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native manager for Vercel-compatible agent skills"
license = "MIT"

[lib]
name = "gino_core"
path = "src/lib.rs"

[[bin]]
name = "gino"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
